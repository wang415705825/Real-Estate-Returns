name: data checks

on:
  push:
    paths: ["data/**", "scripts/check_data.py", ".github/workflows/check-data.yml"]
  pull_request:
    paths: ["data/**", "scripts/check_data.py", ".github/workflows/check-data.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_data.py
